<!DOCTYPE html>

    <style>
        body { font-family: monospace; padding: 20px; max-width: 1200px; }
        .pass { color: green; }
        .fail { color: red; }
        .error { color: red; font-weight: bold; }
        .summary { margin-top: 20px; padding: 10px; background: #f0f0f0; font-size: 1.2em; }
        h2 { margin-top: 30px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        h3 { margin-top: 20px; color: #333; }
    </style>
</head>
<body>
    <h1>Orion Extension Tests</h1>
    <div id="results"></div>
    <div id="summary" class="summary"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('results').innerHTML += `<div class="error">Script Error: ${msg} at line ${line}</div>`;
            return true;
        };
    </script>
    <script src="content.js"></script>
    <script>
        const results = document.getElementById('results');
        const summary = document.getElementById('summary');
        let passed = 0;
        let failed = 0;

        if (typeof window.Orion === 'undefined') {
            results.innerHTML = '<div class="error">ERROR: window.Orion is not defined. content.js may have a syntax error.</div>';
        } else {
            results.innerHTML += '<div style="color:green; margin-bottom:20px;">✓ Orion loaded successfully</div>';
        }

        function test(name, fn) {
            try {
                fn();
                results.innerHTML += `<div class="pass">✓ ${name}</div>`;
                passed++;
            } catch (e) {
                results.innerHTML += `<div class="fail">✗ ${name}: ${e.message}</div>`;
                failed++;
            }
        }

        function expect(actual) {
            return {
                toBe: (expected) => {
                    if (actual !== expected) throw new Error(`Expected ${expected}, got ${actual}`);
                },
                toBeTrue: () => {
                    if (actual !== true) throw new Error(`Expected true, got ${actual}`);
                },
                toBeFalse: () => {
                    if (actual !== false) throw new Error(`Expected false, got ${actual}`);
                },
                toBeGreaterThan: (expected) => {
                    if (actual <= expected) throw new Error(`Expected ${actual} > ${expected}`);
                },
                toBeDefined: () => {
                    if (actual === undefined) throw new Error(`Expected value to be defined`);
                },
                toContain: (expected) => {
                    if (!actual.includes(expected)) throw new Error(`Expected "${actual}" to contain "${expected}"`);
                },
                toBeNull: () => {
                    if (actual !== null) throw new Error(`Expected null, got ${actual}`);
                }
            };
        }

        function describe(name, fn) {
            results.innerHTML += `<h2>${name}</h2>`;
            fn();
        }

        // Save original location getters
        const origLocation = window.location;
        let mockLocation = { href: 'https://example.com/', pathname: '/' };

        // Create a mock location proxy
        function createLocationProxy(href, pathname) {
            return new Proxy({}, {
                get: function(target, prop) {
                    if (prop === 'href') return href;
                    if (prop === 'pathname') return pathname;
                    if (prop === 'hostname') return new URL(href).hostname;
                    if (prop === 'toLowerCase') return function() { return href.toLowerCase(); };
                    return origLocation[prop];
                }
            });
        }

        function setLocation(href, pathname) {
            mockLocation = { href, pathname };
            window.location = createLocationProxy(href, pathname);
        }

        function resetLocation() {
            window.location = origLocation;
        }
