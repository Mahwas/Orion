<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | Modern Transactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="A premium, glassmorphism-inspired personal transaction tracker.">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar glass-panel">
        <div class="nav-container">
            <div class="nav-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#brandGradient)"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#fff" />
                            <stop offset="100%" stop-color="#6366f1" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                <span class="brand-text">Orion</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="#">Transactions</a></li>
                <li><a href="#">Analytics</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
            <div class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=Joshi&background=6366f1&color=fff" alt="Profile"
                    class="profile-pic">
            </div>
        </div>
    </nav>

    <div class="container glass-panel">
        <header>
            <h1>Dashboard</h1>
            <div class="balance-container">
                <div class="total-balance">
                    <h2>Total Balance</h2>
                    <h3 id="balance">$0.00</h3>
                </div>
                <div class="income-expense-cards">
                    <div class="card income-card">
                        <span class="label">Incoming</span>
                        <span class="label">(this month)</span>
                        <span id="income" class="amount">+$0.00</span>
                    </div>
                    <div class="card expense-card">
                        <span class="label">Outgoing</span>
                        <span class="label">(this month)</span>
                        <span id="expense" class="amount">-$0.00</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="bank-accounts">
            <h3>Bank Accounts</h3>
            <ul id="bank-list" class="bank-list">
                <!-- Banks will be injected here via JS -->
            </ul>
            <h3 style="margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 20px;">Add New Bank
                Account</h3>
            <form id="bank-form">
                <div class="form-group">
                    <label for="bank-name">Bank Name</label>
                    <input type="text" id="bank-name" placeholder="e.g. Chase Checkings..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="bank-balance">Initial Balance</label>
                    <input type="number" id="bank-balance" placeholder="Enter balance..." required step="0.01">
                </div>
                <button type="submit" class="btn">Add Bank Account</button>
            </form>
        </section>

        <section class="history">
            <h3 id="history-title">History</h3>
            <ul id="list" class="transaction-list">
                <!-- Transactions will be injected here via JS -->
            </ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
