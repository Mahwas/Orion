<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion | Modern Transactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="A premium, glassmorphism-inspired personal transaction tracker.">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>Orion</h1>
            <div class="balance-container">
                <div class="total-balance">
                    <h2>Total Balance</h2>
                    <h3 id="balance">$0.00</h3>
                </div>
                <div class="income-expense-cards">
                    <div class="card income-card">
                        <span class="label">Incoming</span>
                        <span id="income" class="amount">+$0.00</span>
                    </div>
                    <div class="card expense-card">
                        <span class="label">Outgoing</span>
                        <span id="expense" class="amount">-$0.00</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="add-transaction">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="text">Description</label>
                    <input type="text" id="text" placeholder="Enter description..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="amount">Amount <small>(negative for expense, positive for income)</small></label>
                    <input type="number" id="amount" placeholder="Enter amount..." required step="0.01">
                </div>
                <button type="submit" class="btn">Add Transaction</button>
            </form>
        </section>

        <section class="history">
            <h3>History</h3>
            <ul id="list" class="transaction-list">
                <!-- Transactions will be injected here via JS -->
            </ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
